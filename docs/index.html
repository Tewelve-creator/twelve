<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>站点已停用</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e7ecf1;
      --muted: #8b98a5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, #1c2a38 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 100%, #18222c 0%, transparent 50%),
        var(--bg);
      color: var(--fg);
      padding: 24px;
    }
    main {
      max-width: 28rem;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.75rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>站点已停用</h1>
    <p>该页面已下线，不再提供访问服务。</p>
  </main>
</body>
</html>
