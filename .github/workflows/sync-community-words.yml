name: Sync community words

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.issue.labels.*.name, ','), 'word-submission') || github.event.action == 'unlabeled' || github.event.action == 'closed' || github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Build community-words.json from issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: 'word-submission',
              per_page: 100,
            });
            function pick(body, key) {
              if (!body) return '';
              const m = body.match(new RegExp('[-*]\\s*\\*\\*' + key + '\\*\\*:\\s*(.+)', 'i'));
              return m ? m[1].trim().replace(/^—$/, '') : '';
            }
            const words = [];
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const body = issue.body || '';
              let word = pick(body, '单词') || String(issue.title || '').replace(/^\[词条投稿\]\s*/i, '').trim();
              if (!word) continue;
              words.push({
                id: 'gh_' + issue.number,
                word,
                cat: pick(body, '分类') || '社区投稿',
                explain: pick(body, '用法/解释') || '',
                homo: pick(body, '中文谐音') || '',
                ipa: pick(body, '音标') || '',
                pron: pick(body, '发音') || '',
                tech: pick(body, '技术栈') || '用户投稿',
                level: pick(body, '重要程度') || '了解',
                compare: pick(body, '对比词') || '—',
                oneliner: pick(body, '一句话回答') || '',
                trouble: (pick(body, '卡在哪') || '').split(/[、,，]/).map(s => s.trim()).filter(Boolean),
                issueNumber: issue.number,
                issueUrl: issue.html_url,
                createdAt: issue.created_at,
                source: 'community'
              });
            }
            words.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
            fs.writeFileSync('docs/community-words.json', JSON.stringify({ updatedAt: new Date().toISOString(), words }, null, 2) + '\n');
            console.log('synced', words.length);
      - run: python merge_words_to_excel.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/community-words.json docs/vocab-data.json docs/interview-vocab.xlsx "面试常用单词_Java_Python_FastAPI_LangChain.xlsx" || true
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "chore: sync user words into Excel and vocab-data"
            git push
          fi
